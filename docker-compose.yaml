# TODO: Replace all occurrences of "costaff-agent-template" and "mcp-template" with your agent's names.
# TODO: Replace all TEMPLATE_ env var prefixes with your agent's prefix.

services:
  # TODO: Rename "costaff-agent-template" to your agent's service name (kebab-case)
  agent-template:
    build:
      context: ./agent
    container_name: costaff-agent-template
    restart: on-failure
    environment:
      - PORT=8081
      # TODO: Update PUBLIC_HOST to match the service name above
      - PUBLIC_HOST=costaff-agent-template
      # TODO: Update MCP_TEMPLATE_URL to point to your MCP service
      - MCP_TEMPLATE_URL=http://costaff-mcp-template:8082/mcp
      # TODO: Update TEMPLATE_WORKSPACE_DIR if your agent uses a different workspace path
      - TEMPLATE_WORKSPACE_DIR=/app/data/workspace
      - COSTAFF_AGENT_MODEL_PROVIDER=${COSTAFF_AGENT_MODEL_PROVIDER:-gemini}
      # TODO: Rename TEMPLATE_AGENT_MODEL to your agent's model env var
      - TEMPLATE_AGENT_MODEL=${TEMPLATE_AGENT_MODEL:-gemini-2.5-flash}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LITELLM_MODEL_NAME=${LITELLM_MODEL_NAME:-}
      - LITELLM_API_BASE=${LITELLM_API_BASE:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
    volumes:
      - template_data:/app/data
    depends_on:
      - costaff-mcp-template

  # TODO: Rename "mcp-template" to your MCP service name (kebab-case)
  costaff-mcp-template:
    build:
      context: ./mcp
    container_name: costaff-mcp-template
    restart: on-failure
    environment:
      # TODO: Rename MCP_TEMPLATE_PORT if needed
      - MCP_TEMPLATE_PORT=8082
      # TODO: Update TEMPLATE_WORKSPACE_DIR to match the agent's workspace path
      - TEMPLATE_WORKSPACE_DIR=/app/data/workspace
    volumes:
      - template_data:/app/data

volumes:
  # TODO: Rename "template_data" to your agent's volume name
  template_data:
